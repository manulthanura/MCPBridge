# Run from anywhere with:  docker compose -f docker/docker-compose.yml up
# Paths below are relative to this file; the build context is the repo root.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: mcpbridge
      POSTGRES_PASSWORD: mcpbridge-dev-password
    ports:
      - "5432:5432"
    volumes:
      - ../examples/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpbridge -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcpbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mcpbridge:mcpbridge-dev-password@postgres:5432/shop
      MCPBRIDGE_MODE: read-write
      MCPBRIDGE_TRANSPORT: http
      MCPBRIDGE_HTTP_PORT: "3920"
    ports:
      - "3920:3920"
    volumes:
      - auditdata:/data

volumes:
  pgdata:
  auditdata:
